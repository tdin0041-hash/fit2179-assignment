<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Consumption by Country</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; padding: 40px; }
  </style>
</head>
<body>
  <div id="vis"></div>
  <script>
    const spec = {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "title": {
        "text": "Coffee Consumption by Country",
        "subtitle": "Coffee imports (kg per capita)",
        "fontSize": 18,
        "subtitleFontSize": 13,
        "anchor": "start"
      },
      "width": 900,
      "height": 480,
      "projection": {
        "type": "equalEarth"
      },
      "layer": [
        {
          "data": {
            "url": "https://cdn.jsdelivr.net/npm/vega-datasets@v1.29.0/data/world-110m.json",
            "format": {
              "type": "topojson",
              "feature": "countries"
            }
          },
          "mark": {
            "type": "geoshape",
            "fill": "#d9d9d9",
            "stroke": "white",
            "strokeWidth": 0.5
          }
        },
        {
          "data": {
            "url": "https://cdn.jsdelivr.net/npm/vega-datasets@v1.29.0/data/world-110m.json",
            "format": {
              "type": "topojson",
              "feature": "countries"
            }
          },
          "transform": [
            {
              "lookup": "id",
              "from": {
                "data": {
                  "url": "https://raw.githubusercontent.com/tdin0041-hash/fit2179-assignment/refs/heads/main/coffee%20consumptions.csv",
                  "format": {
                    "type": "csv",
                    "parse": {
                      "id": "number",
                      "Coffee_kg_per_capita": "number",
                      "Imports_tonnes": "number"
                    }
                  }
                },
                "key": "id",
                "fields": ["Country", "Coffee_kg_per_capita", "Imports_tonnes"]
              }
            },
            {
              "filter": "datum.Coffee_kg_per_capita != null"
            }
          ],
          "mark": {
            "type": "geoshape",
            "stroke": "white",
            "strokeWidth": 0.4
          },
          "encoding": {
            "color": {
              "field": "Coffee_kg_per_capita",
              "type": "quantitative",
              "title": "Coffee Consumption (kg per capita)",
              "scale": {
                "scheme": "oranges",
                "type": "log",
                "domain": [0.03, 50]
              },
              "legend": {
                "orient": "bottom-right",
                "titleFontSize": 12,
                "labelFontSize": 11,
                "gradientLength": 200
              }
            },
            "tooltip": [
              {"field": "Country", "type": "nominal", "title": "Country"},
              {"field": "Coffee_kg_per_capita", "type": "quantitative", "title": "Coffee (kg/capita)", "format": ".2f"},
              {"field": "Imports_tonnes", "type": "quantitative", "title": "Total Imports (tonnes)", "format": ","}
            ]
          }
        }
      ]
    };

    vegaEmbed('#vis', spec);
  </script>
</body>
</html>
